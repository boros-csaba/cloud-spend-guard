AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cloud Spend Guard Connection for one AWS account. Creates a read-only role that Cloud Spend Guard
  assumes and a daily CUR 2.0 cost export delivered to a bucket in this account. Must be deployed in us-east-1.

Parameters:
  ConnectionId:
    Type: String
    AllowedPattern: '[0-9a-f]{32}'
    Description: Cloud Spend Guard Connection ID.
  ExternalId:
    Type: String
    AllowedPattern: '[0-9A-F]{32}'
    Description: External ID Cloud Spend Guard uses when assuming the role.
  TrustedAccountId:
    Type: String
    AllowedPattern: '\d{12}'
    Description: AWS account Cloud Spend Guard runs in.

Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: AWS Data Exports only exists in us-east-1. Launch this stack in us-east-1.

Resources:
  ExportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ExportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bcm-data-exports.amazonaws.com
            Action:
              - s3:PutObject
              - s3:GetBucketPolicy
              - s3:GetBucketAcl
            Resource:
              - !GetAtt ExportBucket.Arn
              - !Sub ${ExportBucket.Arn}/*
            Condition:
              StringLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*
                aws:SourceAccount: !Ref AWS::AccountId

  CostExport:
    Type: AWS::BCMDataExports::Export
    DependsOn: ExportBucketPolicy
    Properties:
      Export:
        Name: !Sub cloud-spend-guard-${ConnectionId}
        Description: Cloud Spend Guard cost data.
        DataQuery:
          QueryStatement: >-
            SELECT bill_bill_type, bill_billing_entity, bill_billing_period_end_date, bill_billing_period_start_date,
            bill_invoice_id, bill_invoicing_entity, bill_payer_account_id, bill_payer_account_name,
            capacity_reservation_capacity_reservation_arn, capacity_reservation_capacity_reservation_status,
            capacity_reservation_capacity_reservation_type, cost_category, discount, discount_bundled_discount,
            discount_total_discount, identity_line_item_id, identity_time_interval, line_item_availability_zone,
            line_item_blended_cost, line_item_blended_rate, line_item_currency_code, line_item_iam_principal,
            line_item_legal_entity, line_item_line_item_description, line_item_line_item_type,
            line_item_net_unblended_cost, line_item_net_unblended_rate, line_item_normalization_factor,
            line_item_normalized_usage_amount, line_item_operation, line_item_product_code, line_item_resource_id,
            line_item_tax_type, line_item_unblended_cost, line_item_unblended_rate, line_item_usage_account_id,
            line_item_usage_account_name, line_item_usage_amount, line_item_usage_end_date,
            line_item_usage_start_date, line_item_usage_type, line_item_user_identifier, pricing_currency,
            pricing_lease_contract_length, pricing_offering_class, pricing_public_on_demand_cost,
            pricing_public_on_demand_rate, pricing_purchase_option, pricing_rate_code, pricing_rate_id, pricing_term,
            pricing_unit, product, product_comment, product_fee_code, product_fee_description, product_from_location,
            product_from_location_type, product_from_region_code, product_instance_family, product_instance_type,
            product_instancesku, product_location, product_location_type, product_operation, product_pricing_unit,
            product_product_family, product_region_code, product_servicecode, product_sku, product_to_location,
            product_to_location_type, product_to_region_code, product_usagetype,
            reservation_amortized_upfront_cost_for_usage, reservation_amortized_upfront_fee_for_billing_period,
            reservation_availability_zone, reservation_effective_cost, reservation_end_time,
            reservation_modification_status, reservation_net_amortized_upfront_cost_for_usage,
            reservation_net_amortized_upfront_fee_for_billing_period, reservation_net_effective_cost,
            reservation_net_recurring_fee_for_usage, reservation_net_unused_amortized_upfront_fee_for_billing_period,
            reservation_net_unused_recurring_fee, reservation_net_upfront_value,
            reservation_normalized_units_per_reservation, reservation_number_of_reservations,
            reservation_recurring_fee_for_usage, reservation_reservation_a_r_n, reservation_start_time,
            reservation_subscription_id, reservation_total_reserved_normalized_units,
            reservation_total_reserved_units, reservation_units_per_reservation,
            reservation_unused_amortized_upfront_fee_for_billing_period, reservation_unused_normalized_unit_quantity,
            reservation_unused_quantity, reservation_unused_recurring_fee, reservation_upfront_value, resource_tags,
            savings_plan_amortized_upfront_commitment_for_billing_period, savings_plan_end_time,
            savings_plan_instance_type_family, savings_plan_net_amortized_upfront_commitment_for_billing_period,
            savings_plan_net_recurring_commitment_for_billing_period, savings_plan_net_savings_plan_effective_cost,
            savings_plan_offering_type, savings_plan_payment_option, savings_plan_purchase_term,
            savings_plan_recurring_commitment_for_billing_period, savings_plan_region,
            savings_plan_savings_plan_a_r_n, savings_plan_savings_plan_effective_cost,
            savings_plan_savings_plan_rate, savings_plan_start_time, savings_plan_total_commitment_to_date,
            savings_plan_used_commitment, split_line_item_actual_usage, split_line_item_net_split_cost,
            split_line_item_net_unused_cost, split_line_item_parent_resource_id,
            split_line_item_public_on_demand_split_cost, split_line_item_public_on_demand_unused_cost,
            split_line_item_reserved_usage, split_line_item_split_cost, split_line_item_split_usage,
            split_line_item_split_usage_ratio, split_line_item_unused_cost, tags
            FROM COST_AND_USAGE_REPORT
          TableConfigurations:
            COST_AND_USAGE_REPORT:
              TIME_GRANULARITY: DAILY
              INCLUDE_RESOURCES: 'TRUE'
              INCLUDE_CAPACITY_RESERVATION_DATA: 'TRUE'
              INCLUDE_IAM_PRINCIPAL_DATA: 'TRUE'
              INCLUDE_SPLIT_COST_ALLOCATION_DATA: 'TRUE'
              INCLUDE_MANUAL_DISCOUNT_COMPATIBILITY: 'FALSE'
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref ExportBucket
            S3Prefix: cloud-spend-guard
            S3Region: us-east-1
            S3OutputConfigurations:
              OutputType: CUSTOM
              Format: PARQUET
              Compression: PARQUET
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloud-spend-guard-${ConnectionId}
      Description: Read-only access for Cloud Spend Guard.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${TrustedAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess
      Policies:
        - PolicyName: cloud-spend-guard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadCostExport
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ExportBucket.Arn
                  - !Sub ${ExportBucket.Arn}/*
              - Sid: CheckCostExport
                Effect: Allow
                Action:
                  - bcm-data-exports:GetExport
                  - bcm-data-exports:ListExports
                  - bcm-data-exports:ListExecutions
                Resource: '*'
              - Sid: CheckOrganization
                Effect: Allow
                Action: organizations:DescribeOrganization
                Resource: '*'
              - Sid: ResourceExplorer
                Effect: Allow
                Action:
                  - resource-explorer-2:ListIndexes
                  - resource-explorer-2:GetIndex
                  - resource-explorer-2:GetDefaultView
                  - resource-explorer-2:GetView
                  - resource-explorer-2:Search
                Resource: '*'
              - Sid: CheckOwnPermissions
                Effect: Allow
                Action: iam:SimulatePrincipalPolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloud-spend-guard-${ConnectionId}

Outputs:
  RoleArn:
    Value: !GetAtt Role.Arn
